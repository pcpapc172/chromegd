name: Release Geode Mod

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Update mod version
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Validate version and update mod.json
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          pattern = r"v[0-9]+\.[0-9]+\.[0-9]+(?:-(?:alpha|beta|prerelease)(?:\.[0-9]+)?)?"
          if not re.fullmatch(pattern, version):
              raise SystemExit(
                  "Version must be a Geode version such as v1.0.0, "
                  "v1.0.0-beta, or v1.0.0-beta.1"
              )

          path = Path("mod.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit version bump
        id: commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${RELEASE_VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows
    needs:
      - prepare
    runs-on: windows-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # CEF is far too large to commit, so fetch the exact binary distribution
      # the mod is built against and lay it out where CMakeLists expects it.
      - name: Fetch CEF binary distribution
        shell: pwsh
        run: |
          $url = "https://cef-builds.spotifycdn.com/cef_binary_150.0.11%2Bgb887805%2Bchromium-150.0.7871.115_windows64_minimal.tar.bz2"
          Invoke-WebRequest -Uri $url -OutFile cef.tar.bz2
          tar -xf cef.tar.bz2
          $dir = Get-ChildItem -Directory -Filter "cef_binary_*" | Select-Object -First 1
          Rename-Item -Path $dir.FullName -NewName "cef"

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Win64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcpapc172.chromium-in-gd-${{ inputs.version }}-windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pcpapc172.chromium-in-gd-${{ inputs.version }}-windows
          path: build-output

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          RELEASE_ASSET="$(find build-output -type f -name '*.geode' -print -quit)"
          if [[ -z "$RELEASE_ASSET" || ! -f "$RELEASE_ASSET" ]]; then
            echo "No .geode package found under build-output" >&2
            exit 1
          fi

          release_args=(
            "$RELEASE_VERSION"
            "$RELEASE_ASSET"
            --repo "$GITHUB_REPOSITORY"
            --target "$RELEASE_COMMIT"
            --title "$RELEASE_VERSION"
            --generate-notes
          )
          if [[ "$RELEASE_VERSION" =~ -(alpha|beta|prerelease)(\.|$) ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
